name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: meter runs on the sample transcript
        run: node skills/cheapskate/scripts/meter.js tests/fixtures/sample.jsonl
